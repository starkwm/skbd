name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'starkwm/skbd' && !github.event.deleted
    permissions:
      contents: write
    uses: starkwm/workflows/.github/workflows/release-bottle.yml@ed4c349a9260ad04c26f1972e54ce362bb367684
    with:
      version-prefix: skbd
    secrets:
      HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
